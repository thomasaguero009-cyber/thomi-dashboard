name: Sync aprendizaje de Thom.i

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-aprendizaje.js
      - run: node scripts/sync-resumen-inbox.js
      - run: |
          if ! git diff --quiet -- data/aprendizaje.json data/resumen-inbox.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/aprendizaje.json data/resumen-inbox.json
            git commit -m "Sync aprendizaje y resumen de inbox de Thom.i"
            git push
          else
            echo "Sin cambios, no hay nada que commitear."
          fi
